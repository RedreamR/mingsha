plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'team.rainfall.mingsha'
version = '1.0-SNAPSHOT'

// Age of History 2 Definitive Edition ships with a Java 8 runtime.
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile).configureEach {
    // The project is compiled with Java 8; javac 8 does not support --release.
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

repositories {
    //阿里云镜像
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/com.googlecode.juniversalchardet/juniversalchardet
    implementation 'com.udojava:EvalEx:2.7'
    shadow("com.badlogicgames.gdx:gdx-lwjgl3-angle:1.12.0")
    shadow "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.0"
    shadow "com.badlogicgames.gdx:gdx-platform:1.12.0:natives-desktop"
    shadow "com.badlogicgames.gdx:gdx-freetype-platform:1.12.0:natives-desktop"
    shadow "com.badlogicgames.gdx:gdx-freetype:1.12.0"
    shadow fileTree(dir:'libs',includes: ['*.jar'])
}

